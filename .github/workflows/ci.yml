name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 generators/ config/ spark/ api/ dashboard/ \
            --max-line-length=120 \
            --ignore=E501,W503,E203,E241,E221,E302,E305,E402,W292,E126,F401,F841 \
            --exclude=__pycache__

      - name: Run unit tests
        run: pytest tests/test_event_generator.py -v --tb=short

      - name: Validate docker-compose syntax
        run: |
          pip install docker-compose
          docker-compose config --quiet

  dbt-validation:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: retail_warehouse
          POSTGRES_USER: retail
          POSTGRES_PASSWORD: retail123
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dbt
        run: pip install dbt-postgres==1.7.0 protobuf==4.25.3

      - name: Create dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << EOF
          retail_dbt:
            target: dev
            outputs:
              dev:
                type: postgres
                host: localhost
                port: 5432
                user: retail
                password: retail123
                dbname: retail_warehouse
                schema: dbt_marts
                threads: 4
          EOF

      - name: Create warehouse tables and seed test data
        run: |
          PGPASSWORD=retail123 psql -h localhost -U retail -d retail_warehouse \
            -f warehouse/init/01_streaming_tables.sql
          PGPASSWORD=retail123 psql -h localhost -U retail -d retail_warehouse \
            -f warehouse/init/02_star_schema.sql
          PGPASSWORD=retail123 psql -h localhost -U retail -d retail_warehouse -c "
            INSERT INTO dim_date (date_id, year, month, day, quarter, day_of_week, is_weekend)
            VALUES ('2026-05-15', 2026, 5, 15, 2, 3, false)
            ON CONFLICT DO NOTHING;

            INSERT INTO fact_orders
              (order_id, customer_id, order_date, total_amount, item_count, status, device, region, currency)
            VALUES
              ('ORD-001', 'CUST-000001', '2026-05-15', 150.00, 2, 'confirmed', 'mobile', 'CA', 'USD'),
              ('ORD-002', 'CUST-000002', '2026-05-15', 89.99, 1, 'confirmed', 'desktop', 'NY', 'USD');

            INSERT INTO fact_payments
              (payment_id, order_id, customer_id, payment_date, amount, method, status, currency, gateway_ref)
            VALUES
              ('PAY-001', 'ORD-001', 'CUST-000001', '2026-05-15', 150.00, 'card', 'success', 'USD', 'GW-0001-AAAA'),
              ('PAY-002', 'ORD-002', 'CUST-000002', '2026-05-15', 89.99, 'paypal', 'success', 'USD', 'GW-0002-BBBB');

            INSERT INTO fact_product_clicks
              (click_id, customer_id, product_id, click_date, session_id, device, referrer, duration_ms)
            VALUES
              ('CLK-001', 'CUST-000001', 'PROD-0001', '2026-05-15', 'SESS-001', 'mobile', 'search', 5000),
              ('CLK-002', 'CUST-000002', 'PROD-0002', '2026-05-15', 'SESS-002', 'desktop', 'social', 12000);

            INSERT INTO dim_customer (customer_id, first_seen_at, last_seen_at, total_orders, preferred_device)
            VALUES
              ('CUST-000001', NOW(), NOW(), 1, 'mobile'),
              ('CUST-000002', NOW(), NOW(), 1, 'desktop')
            ON CONFLICT DO NOTHING;

            INSERT INTO dim_product (product_id, category, first_clicked, last_clicked, total_clicks)
            VALUES
              ('PROD-0001', 'electronics', NOW(), NOW(), 1),
              ('PROD-0002', 'clothing', NOW(), NOW(), 1)
            ON CONFLICT DO NOTHING;
          "

      - name: dbt debug
        working-directory: dbt/retail_dbt
        run: dbt debug

      - name: dbt run
        working-directory: dbt/retail_dbt
        run: dbt run

      - name: dbt test
        working-directory: dbt/retail_dbt
        run: dbt test